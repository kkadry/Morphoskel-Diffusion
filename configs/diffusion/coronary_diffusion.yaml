num_cond: 3
hparams:
  base_lr: 0.000025
  params:
    timesteps: 1000
    beta_schedule: "linear"
    linear_start: 0.0015
    linear_end: 0.0195
    loss_type: "l2"
    log_every_t: 200
    clip_denoised: True
    original_elbo_weight: 0.0
    v_posterior: 0.0
    l_simple_weight: 1.0
    parameterization: "eps"
    learn_logvar: False
    logvar_init: 0.0
    conditioning_key: "concat"
    unet_config:
      params:
        image_size: 32
        in_channels: 6
        out_channels: 3
        model_channels: 128
        attention_resolutions: [8,4,2]
        num_res_blocks: 2
        channel_mult: [1,2,3]
        dropout: 0.0
        conv_resample: True
        num_heads: 1
        use_scale_shift_norm: False
        resblock_updown: True
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim:
sampling_params:
    sigma_data: 1.0,
    sigma_min: 0.01,
    sigma_max: 80,
    sigma_sample_density: {
    type: "lognormal",
    mean: 1,
    std: 1.2
}
