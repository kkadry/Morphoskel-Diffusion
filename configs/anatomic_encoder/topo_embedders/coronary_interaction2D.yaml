defaults:
  - topo_embedding_defaults@interaction2D
  - _self_

interaction2D:
  _target_: src.conditioning.topo_embedders.TopologicalInteractionEmbedder
  tensor_embedder:
    _target_: src.conditioning.tensor_embedders.Voxel2VoxelEmbedder
  channels: [1]
  metric_min: 0
  metric_max: 1
  emb_axis: 2
  dim: 2
  connectivity: 4
  inclusion: [[2,3],[1,3]]
  exclusion: [[1,2],[0,1]]
  min_thick: 1
  logging:
    dim_tags: ['n','x','y','z']
    attributes:
      metric_name: "interaction2D"
      metric_dim: 2
